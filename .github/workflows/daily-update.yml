name: Daily Research & Conferences Update & Deploy

on:
  schedule:
    # 06:00 UTC daily = 07:00 UK summer time / 06:00 UK winter time
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: "Only rebuild/deploy the dashboard (no scraping)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "workers/**"
      - "scraper/**"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-research-conferences-sync
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape active research projects & conferences
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.skip_scrape)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run active research & conference scraper pipeline
        run: python -m scraper --min-records 25

      - name: Commit refreshed research & conference data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to research & conference data."
          else
            git commit -m "chore(data): daily active research & conferences sync ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi

  deploy:
    name: Build & deploy dashboard to GitHub Pages
    needs: scrape
    if: always() && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install & build static dashboard
        working-directory: apps/dashboard
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_RECOMMENDER_URL: ${{ secrets.VITE_RECOMMENDER_URL || vars.VITE_RECOMMENDER_URL }}
        run: |
          npm install
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dashboard/dist

      - id: deployment
        uses: actions/deploy-pages@v4

